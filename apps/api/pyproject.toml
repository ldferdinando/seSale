[project]
name = "sesale-api"
version = "0.1.0"
description = "seSALE — backend FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.111.*",
    "sqlmodel==0.0.19",
    "alembic>=1.13,<1.14",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-jose[cryptography]>=3,<4",
    "passlib[bcrypt]>=1.7,<1.8",
    "slowapi>=0.1,<0.2",
    "uvicorn[standard]==0.29.*",
    "httpx==0.27.*",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5,<6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
