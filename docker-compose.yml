services:
  db:
    image: postgres:16-alpine
    container_name: sesale-db
    environment:
      POSTGRES_DB: sesale
      POSTGRES_USER: sesale
      POSTGRES_PASSWORD: sesale
    ports:
      - "5432:5432"
    volumes:
      - sesale_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesale -d sesale"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sesale_pgdata:
