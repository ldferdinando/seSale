name: Backend CI
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"

jobs:
  test:
    runs-on: ubuntu-latest

    # El servicio de Postgres es solo para correr `alembic upgrade head`
    # contra un motor real (validar que las migraciones son válidas contra
    # Postgres, no solo contra SQLite). Los tests de pytest NO lo usan:
    # tests/conftest.py crea su propio engine SQLite in-memory, ignorando
    # DATABASE_URL por completo (desde la Etapa 3).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # postgresql+psycopg (sync) — el proyecto usa psycopg 3 sync en todo
      # el backend (SQLModel Session, no AsyncSession), nunca asyncpg.
      DATABASE_URL: postgresql+psycopg://test_user:test_pass@localhost:5432/test_db
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key-for-ci-only
      ALLOWED_ORIGINS: http://localhost:3000
      DISABLE_SETUP_ENDPOINT: "false"
      SUPABASE_URL: ""
      SUPABASE_SERVICE_KEY: ""
      MERCADOPAGO_ACCESS_TOKEN: ""
      MERCADOPAGO_WEBHOOK_SECRET: ""
      RESEND_API_KEY: ""
      ADMIN_EMAIL: admin@test.com

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run migrations (contra Postgres real)
        run: uv run alembic upgrade head

      - name: Run tests with coverage (SQLite in-memory)
        run: |
          uv run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - name: Run bandit security check
        run: uv run bandit -r app/ -ll
