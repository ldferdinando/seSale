name: Frontend CI
on:
  push:
    branches: [main, develop]
    paths:
      - "apps/web/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      NEXT_PUBLIC_MP_PUBLIC_KEY: ""
      NEXT_PUBLIC_SESALE_WHATSAPP: "5492984000000"
      NEXT_PUBLIC_MAINTENANCE_MODE: "false"
      NEXT_PUBLIC_LAUNCH_DATE: ""

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      # Bloqueante: dependencias de producción (lo que se deploya). Se
      # reactivó al actualizar next 16.2.12→16.3.8 — ver a_revisar.md.
      - name: Run npm audit — producción (falla con vulnerabilidades altas/críticas)
        run: npm audit --omit=dev --audit-level=high

      # Informativo: dependencias de desarrollo (vitest, tailwindcss) — no se
      # deployan. Quedan hallazgos sin fix compatible (vitest 5 es mayor,
      # braces no tiene fix), documentados en a_revisar.md.
      - name: Run npm audit — desarrollo (informativo)
        run: npm audit --audit-level=high
        continue-on-error: true
